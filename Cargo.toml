[workspace]
resolver = "2"
members = [
    "crates/stack-inlet",
    "crates/stack-trident",
    "crates/stack-bumpers",
    "crates/stack-minotaur",
    "crates/stack-greenwave",
    "crates/stack-transmission",
    "crates/stack-sentinel",
    "crates/stack-anc-harness",
    "crates/stack-anc-ceiling",
    "crates/stack-anc-adaptive",
    "crates/stack-anc-pipeline",
    "crates/stack-p3-2",
    "crates/_warm",
    "crates/stack-ffi",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
metrics = "0.24"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
thiserror = "2"
subtle = "2.6"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
libc = "0.2"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
overflow-checks = true
debug = 1

[profile.bench]
overflow-checks = true
debug = 1
