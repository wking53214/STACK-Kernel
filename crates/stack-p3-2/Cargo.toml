[package]
name = "stack-p3-2"
version = "1.0.0"
edition = "2021"
description = "≡TACK P3.2: Hard Preemption with Hybrid Boundary Model and Flywheel Schema"
authors = ["William N. King <wking53214@gmail.com>"]
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"
